# Tests du Bureau sur chaque PR et chaque push sur main (KT-37) : les mêmes que `sh tools/test.sh --chrome` en local.
# Versions minimales annoncées par le README : Node 20, Python 3.9.
name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]  # labeled : « références seules » lève la règle du guide
  push:
    branches: [main]
  workflow_dispatch:  # relancé par visual-refs.yml après une mise à jour des références (un push du jeton d'Actions ne relance rien)

permissions:
  contents: read
  pull-requests: read  # règle du guide : labels de la PR quand les tests sont relancés par visual-refs.yml
  statuses: write  # statut « tests » du commit quand les tests sont relancés par visual-refs.yml (dernière étape)

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # règle du guide : diff avec la branche de base

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Dépendances Python (captures et pilotage de Chrome)
        run: python3 -m pip install --disable-pip-version-check pillow websocket-client

      - name: Chrome
        run: google-chrome --version

      - name: sh tools/test.sh --chrome
        run: sh tools/test.sh --chrome
        env:
          BUREAU_CHROME: google-chrome
          # Ubuntu 24.04 refuse le bac à sable de Chrome aux utilisateurs non privilégiés (AppArmor)
          BUREAU_CHROME_ARGS: --no-sandbox

      # sur la PR, et sur les tests relancés par visual-refs.yml (workflow_dispatch) : c'est ce run-là qui voit les
      # références refaites ; levée par le label « références seules »
      - name: Règle du guide (références visuelles changées => guide/ changé)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh pr view "${{ github.head_ref || github.ref_name }}" --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || true)
          case ",$labels," in *",références seules,"*) echo "règle du guide levée (label « références seules »)"; exit 0;; esac
          python3 tools/visual.py --guide-rule "origin/${{ github.base_ref || 'main' }}"

      - name: Captures qui s'écartent de leur référence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visuel
          path: dist/visual/
          if-no-files-found: ignore

      # tests relancés par visual-refs.yml (workflow_dispatch) : GitHub ne compte pas ce run dans le récapitulatif des
      # contrôles de la PR, qui restait bloquée faute du contrôle obligatoire « tests ». Un statut de commit, lui, y
      # entre : ce run publie son résultat sous ce nom sur le commit testé (celui des références refaites).
      - name: Statut « tests » du commit (tests relancés par visual-refs.yml)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="${{ job.status == 'success' && 'success' || 'failure' }}" -f context=tests \
            -f description="Tests relancés après les références visuelles" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
