<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support · bilan</title>
<!-- Page Kronn « Support · bilan » : l'historique des demandes du canal Support et de leurs investigations (dataset
     support_bilan, workflows/support_bilan.py, cron support_bilan). Vanilla, sans ressource externe (CSP de Kronn : script
     et style en ligne seulement). Couleurs : les jetons de page/bilan.html. Le chiffre clé du vidéoprojecteur vient du champ
     kpi du dataset. -->
<style>
:root{
  --bg:#f3efe6; --panel:#fffdf8; --ink:#25221d; --muted:#6f685c; --line:#e2dccf; --chip:#f0ebe0;
  --accent:#2f6fd6; --ok:#2e9e5b; --warn:#d89614; --err:#d1453b; --info:#4a7fe0; --idle:#7a7266; --on-accent:#ffffff;
  --h0:#f0ebe0; --h1:#cfe0f7; --h2:#86aee9; --h3:#2f6fd6; --hx:#d1453b; --sign:#22232b; --sign-ink:#ece8df; --sign-mut:#a29c90;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#17181c; --panel:#202228; --ink:#ece8df; --muted:#a29c90; --line:#2f323a; --chip:#2a2d34;
  --accent:#6b9cf0; --ok:#4cc27c; --warn:#f0b03a; --err:#f06a5f; --info:#7aa2f2; --idle:#9a9284; --on-accent:#0d1b33;
  --h0:#2a2d34; --h1:#2c3d5c; --h2:#3f63a3; --h3:#6b9cf0; --hx:#f06a5f;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#17181c; --panel:#202228; --ink:#ece8df; --muted:#a29c90; --line:#2f323a; --chip:#2a2d34;
  --accent:#6b9cf0; --ok:#4cc27c; --warn:#f0b03a; --err:#f06a5f; --info:#7aa2f2; --idle:#9a9284; --on-accent:#0d1b33;
  --h0:#2a2d34; --h1:#2c3d5c; --h2:#3f63a3; --h3:#6b9cf0; --hx:#f06a5f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 16px 32px}
.wrap{max-width:1360px;margin:0 auto;display:grid;gap:14px}
.num,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.mut{color:var(--muted);font-size:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--sign);color:var(--sign-ink);padding:10px 14px;border-radius:8px}
h1{font:700 18px/1.3 ui-monospace,Menlo,monospace;margin:0;letter-spacing:.02em}
header .mut{color:var(--sign-mut)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters label{font:12px system-ui,sans-serif;color:var(--sign-ink)}
.filters select{background:#2f313a;border:2px solid #444754;padding:3px 6px;color:#ece8df}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:3px solid var(--line);padding:8px 12px;background:var(--panel)}
.kpi b{display:block;font:600 22px/1.15 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
.kpi.err b{color:var(--err)}
.up{color:var(--ok);font-weight:700}.down{color:var(--err);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px}
.box{border:3px solid var(--line);padding:10px 12px;background:var(--panel);min-width:0}
.h{font:700 12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px;display:flex;justify-content:space-between;gap:8px}
.h .mut{text-transform:none;letter-spacing:0;font-weight:400}
.why{color:var(--muted);font-size:12px;margin:0 0 10px}
.hb{display:grid;grid-template-columns:150px minmax(0,1fr) 56px;gap:4px 8px;align-items:center;font-size:12.5px}
.hb .bar{height:12px;background:var(--chip);position:relative}
.hb .bar i{position:absolute;inset:0 auto 0 0;background:var(--info)}
.hb .bar i.hot{background:var(--warn)}.hb .bar i.ok{background:var(--ok)}.hb .bar i.idle{background:var(--idle)}.hb .bar i.err{background:var(--err)}
.hb .v{text-align:right}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:12.5px;width:100%}
th{color:var(--muted);font-weight:600;text-align:left}
td,th{padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
.heat td.c{width:46px;height:26px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-weight:700;border:2px solid var(--panel)}
.heat th{text-align:center}.heat th:first-child{text-align:left}
.l0{background:var(--h0);color:var(--muted)}.l1{background:var(--h1)}.l2{background:var(--h2);color:#fff}.l3{background:var(--h3);color:var(--on-accent)}.lx{background:var(--hx);color:#fff}
.pill{display:inline-block;font:700 10.5px system-ui;padding:1px 6px;white-space:nowrap}
.pill.ok{background:var(--ok);color:#fff}.pill.warn{background:var(--warn);color:#1c1c1c}.pill.err{background:var(--err);color:#fff}
.pill.idle{background:var(--chip);color:var(--muted)}.pill.info{background:var(--info);color:#fff}
svg text{fill:var(--muted);font:11px system-ui,sans-serif}
svg .ax{stroke:var(--line)}svg .ln{stroke:var(--accent);fill:none;stroke-width:2.5}svg .ar{fill:var(--accent);opacity:.12}
svg .pt{fill:var(--accent)}svg .mk{stroke:var(--warn);stroke-dasharray:3 3}svg .mkt{fill:var(--ink);font-weight:600}
tr.row{cursor:pointer}tr.row:hover td,tr.row:focus-visible td{background:var(--chip)}tr.row.on td{background:var(--chip);font-weight:600}
.fiche{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin-top:10px}
.sec.wide{grid-column:1/-1}
.sec h4{font:700 11.5px system-ui;text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;color:var(--muted)}
.gantt{display:grid;grid-template-columns:96px minmax(0,1fr);gap:3px 6px;font-size:11.5px;align-items:center}
.gantt .tr{position:relative;height:11px;background:var(--chip)}
.gantt .tr i{position:absolute;top:0;bottom:0;background:var(--info);min-width:2px}
.gantt .tr i.g{background:var(--warn)}.gantt .tr i.x{background:var(--err)}.gantt .tr i.o{background:var(--ok)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
.note{border-left:4px solid var(--warn);background:var(--chip);padding:6px 10px;font-size:12.5px;overflow-wrap:anywhere;white-space:normal}
.note.ok{border-color:var(--ok)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
button:focus-visible,select:focus-visible,tr.row:focus-visible{outline:3px solid var(--accent);outline-offset:1px}.funnel{display:grid;gap:6px}
.funnel .st{display:grid;grid-template-columns:150px minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:12.5px}
.funnel .b{height:22px;background:var(--info);display:flex;align-items:center;padding-left:6px;color:#fff;font:700 11px system-ui;min-width:22px}
.funnel .b.ok{background:var(--ok)}.funnel .b.warn{background:var(--warn);color:#1c1c1c}
.leak{color:var(--err);font-size:11.5px;margin:-2px 0 2px 158px}
.tag{display:inline-block;font:600 10.5px system-ui;padding:1px 6px;background:var(--chip);color:var(--ink)}
.quote{border-left:3px solid var(--line);padding:4px 8px;font-size:12px;color:var(--muted);margin:6px 0 0}
.teams{white-space:pre-line;font-size:12px;background:var(--chip);padding:8px 10px;overflow-wrap:anywhere}
.check{margin:0;padding-left:18px}.check li{font-size:12px;margin:2px 0}
.empty-s{padding:14px;background:var(--chip);font-size:12.5px;text-align:center}
.empty-s b{display:block;font:600 18px ui-monospace,Menlo,monospace;margin-bottom:2px}
tr.off td{color:var(--muted)}
p.note{margin:8px 0 0;font-style:italic;color:var(--muted);font-size:11.5px}
@media (max-width:520px){.funnel .st{grid-template-columns:110px minmax(0,1fr) 44px}.leak{margin-left:118px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Chargement du bilan…</div></div>
<script>
'use strict';
(function(){
// postes de l'investigation (sous-workflows support_<poste>) ; « investigation » : l'agent unique d'avant le découpage (#156)
const POSTES=[['tri','🏷 Tri'],['logs','🔎 Logs'],['cause','🧩 Cause'],['reponse','✉ Réponse'],['relecture','🧐 Relecture'],
  ['investigation','🔎 Investigation d\'un bloc']];
const STATES={new:['info','nouveau'],run:['info','en cours'],gate:['warn','à valider'],done:['info','📣 répondu'],
  resolved:['ok','✅ traité'],answered:['idle','pris par un collègue'],relaunched:['warn','↩ relancé'],ignored:['err','réponse refusée'],
  failed:['err','en panne'],skipped:['idle','🔕 ignoré']};
const CAUSES={longueur:'trop long, trop technique',exactitude:'cause fausse ou à vérifier',action:'action ou suivi manquant',
  ton:'ton, langue, formule',autre:'autre'};
const ROW={open:'🧭 Ouverture',tri:'🏷 Tri',logs:'🔎 Logs',cause:'🧩 Cause',investigate:'🔎 Investigation',reponse:'✉ Réponse',
  relecture:'🧐 Relecture',gate:'✋ Toi',post:'📣 Post'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDur=s=>{if(s==null)return '–';if(s<60)return Math.round(s)+' s';const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');};
const fmtMs=ms=>{if(ms==null)return '–';const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const fmtUsd=v=>(v||0).toFixed(2).replace('.',',')+' $';
const pct=(a,b)=>b?Math.round(a/b*100):0;
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;};
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const day=iso=>{const d=new Date(iso||'');return isNaN(d)?'':d.toLocaleString('fr-FR',{timeZone:'Europe/Paris',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(',','');};
const discUrl=(data,id)=>{const b=data.kronn_ui||'http://localhost:5173/';return (/\/$/.test(b)?b+'index.html':b)+'#discussion-'+encodeURIComponent(id);};

function readSupportBilan(k){
  try{
    if(!k||!k.datasets)return null;
    let d=k.datasets.support_bilan;
    if(d&&d.current!==undefined)d=d.current;
    if(typeof d==='string')d=JSON.parse(d);
    return d&&Array.isArray(d.demandes)?d:null;
  }catch(e){return null;}
}
// les demandes retenues par les filtres (période en jours, projet)
function pick(data,f){
  const now=Date.parse(data.generated_at||'')||Date.now(), lim=now-(f.jours||30)*864e5;
  return (data.demandes||[]).filter(d=>(Date.parse(d.at||'')||now)>=lim&&(!f.projet||d.projet===f.projet));
}
function aggregate(data,f){
  const rows=pick(data,f), inv=rows.filter(d=>d.runs>0), posted=rows.filter(d=>d.poste_at);
  const a={rows,n:rows.length,inv:inv.length,posted:posted.length};
  a.ailleurs=rows.filter(d=>!d.runs&&['answered','resolved','done'].includes(d.state)).length;
  a.medReponse=median(posted.map(d=>d.reponse_s).filter(x=>x!=null));
  const gated=inv.filter(d=>d.gate&&d.gate.visites>0);
  a.gated=gated.length;
  a.premierCoup=gated.filter(d=>!d.gate.changements&&!d.gate.refus).length;
  a.refus=gated.filter(d=>d.gate.refus).length;
  a.changements=sum(gated.map(d=>d.gate.changements));
  a.attente=median(gated.map(d=>d.gate.attente_ms/Math.max(1,d.gate.visites)));
  a.relances=rows.filter(d=>d.relance).length;
  const runs=sum(inv.map(d=>d.runs));a.cout=sum(inv.map(d=>d.cout));a.coutMoy=runs?a.cout/runs:0;
  // entonnoir : chaque marche et ce qui en sort
  a.funnel={demandes:a.n,inv:a.inv,propose:gated.length,poste:a.posted,traite:posted.filter(d=>d.resolu).length,
    skipped:rows.filter(d=>d.state==='skipped').length,answered:rows.filter(d=>!d.runs&&d.state==='answered').length,
    sans:rows.filter(d=>!d.runs&&(d.state==='resolved'||d.state==='done')).length,
    panne:inv.filter(d=>d.state==='failed').length,refusees:inv.filter(d=>d.gate&&d.gate.refus&&!d.poste_at).length,
    relancees:posted.filter(d=>d.relance).length};
  // postes : moyenne par investigation qui l'a passé
  a.postes={};
  for(const d of inv)for(const[k,v]of Object.entries(d.postes||{})){const p=a.postes[k]||(a.postes[k]={n:0,ms:0,cout:0,reprises:0,modele:null});
    p.n+=d.runs||1;p.ms+=v.ms||0;p.cout+=v.cout||0;p.reprises+=Math.max(0,(v.passages||0)-(d.runs||1));p.modele=v.modele||p.modele;}
  a.notes={tri:inv.filter(d=>d.deja_traite).length,verifs:inv.filter(d=>d.verifs!=null),
    supposee:inv.filter(d=>d.certitude==='supposee').length,certitude:inv.filter(d=>d.certitude).length,
    renvois:sum(inv.map(d=>d.renvois||0))};
  a.causes={};for(const d of rows)for(const c of d.causes||[])a.causes[c]=(a.causes[c]||0)+1;
  // projet × catégorie (catégorie du 🏷 Tri)
  a.cats=[...new Set(inv.map(d=>d.categorie||'non classée'))];
  a.heat={};for(const d of inv){const p=d.projet||'sans projet',c=d.categorie||'non classée';(a.heat[p]||(a.heat[p]={}))[c]=(a.heat[p][c]||0)+1;}
  return a;
}
const pill=(c,l)=>`<span class="pill ${c}">${esc(l)}</span>`;
const statePill=s=>{const[c,l]=STATES[s]||['idle',s||'?'];return pill(c,l);};
const bars=(items,max,cls)=>items.map(([label,v,txt,c])=>`<span>${esc(label)}</span><span class="bar"><i class="${c||cls||''}" style="width:${max?Math.max(1,Math.round(v/max*100)):0}%"></i></span><span class="v num">${esc(txt)}</span>`).join('');

function kpis(a){
  return `<div class="kpis">
  <div class="kpi"><b>${a.n}</b><span>demandes sur le canal</span></div>
  <div class="kpi"><b>${a.inv} / ${a.n}</b><span>investiguées par l'agent · ${a.ailleurs} prises ou réglées ailleurs</span></div>
  <div class="kpi"><b>${a.medReponse==null?'–':fmtDur(a.medReponse)}</b><span>médiane demande → réponse en fil (heures ouvrées)</span></div>
  <div class="kpi"><b>${a.premierCoup} / ${a.gated}</b><span>réponses validées du premier coup${a.refus?' · '+a.refus+' refusée'+(a.refus>1?'s':''):''}</span></div>
  <div class="kpi"><b>${a.attente==null?'–':fmtDur(a.attente/1000)}</b><span>attente médiane à ta validation</span></div>
  <div class="kpi${a.relances?' err':''}"><b>${a.relances}</b><span>relancées par l'auteur après une réponse</span></div>
  <div class="kpi"><b>${fmtUsd(a.coutMoy)}</b><span>par investigation · ${fmtUsd(a.cout)} en tout</span></div>
</div>`;
}
function funnel(a){
  const f=a.funnel,max=Math.max(1,f.demandes);
  const st=(l,v,c)=>`<div class="st"><span>${l}</span><div class="b ${c||''}" style="width:${Math.max(4,pct(v,max))}%">${v}</div><span class="num">${pct(v,max)} %</span></div>`;
  const leak=parts=>{const t=parts.filter(([v])=>v).map(([v,un,plus])=>v+' '+(v>1?plus:un)).join(' · ');return t?`<div class="leak">${esc(t)}</div>`:'';};
  return `<div class="box"><div class="h">Du message au ✅</div>
  <p class="why">Où les demandes s'arrêtent. En rouge, ce qui sort entre deux marches.</p>
  <div class="funnel">${st('📩 Demandes',f.demandes)}${leak([[f.skipped,'🔕 ignorée','🔕 ignorées'],[f.answered,'prise par un collègue','prises par un collègue'],[f.sans,'réglée sans l\'agent','réglées sans l\'agent']])}
  ${st('🔎 Investiguées',f.inv)}${leak([[f.panne,'en panne','en panne']])}
  ${st('✋ Réponse proposée',f.propose)}${leak([[f.refusees,'refusée à la gate','refusées à la gate']])}
  ${st('📣 Postées en fil',f.poste,'warn')}${leak([[f.relancees,'relancée par l\'auteur','relancées par l\'auteur']])}
  ${st('✅ Traitées',f.traite,'ok')}</div>
  <p class="note">Le ✅ n'est pas toujours posé dans le canal : « postée » est la marche fiable.</p></div>`;
}
function postes(a){
  const n=a.notes;
  const extra={tri:n.tri?n.tri+' déjà traitée'+(n.tri>1?'s':''):'',
    logs:n.verifs.length?(sum(n.verifs.map(d=>d.verifs))/n.verifs.length).toFixed(1).replace('.',',')+' vérif. à la main':'',
    cause:n.certitude?'supposée '+n.supposee+' fois sur '+n.certitude:'',
    reponse:a.postes.reponse&&a.postes.reponse.reprises?'reprise '+a.postes.reponse.reprises+' fois':'',
    relecture:n.renvois?'« revoir » '+n.renvois+' fois':'',investigation:'avant les postes (#156)'};
  const keys=POSTES.filter(([k])=>k!=='investigation'||a.postes[k]);
  const hot=Object.entries(a.postes).sort((x,y)=>y[1].cout/y[1].n-x[1].cout/x[1].n)[0];
  const rows=keys.map(([k,l])=>{const p=a.postes[k];
    if(!p)return `<tr class="off"><td>${l}</td><td>·</td><td class="r">·</td><td class="r">·</td><td>pas encore de run</td></tr>`;
    const h=hot&&hot[0]===k&&Object.keys(a.postes).length>1;
    return `<tr><td>${h?'<b>'+l+'</b>':l}</td><td class="mut">${esc(String(p.modele||'').replace(/^claude-/,''))}</td><td class="r num">${fmtMs(p.ms/p.n)}</td>
    <td class="r num"${h?' style="color:var(--warn);font-weight:700"':''}>${fmtUsd(p.cout/p.n)}</td><td class="mut">${esc(extra[k]||'')}</td></tr>`;}).join('');
  return `<div class="box"><div class="h">Les postes <span class="mut">moyenne par investigation</span></div>
  <p class="why">Durée, coût et retouches par poste. En orange : le poste qui coûte le plus.</p>
  <div class="scroll"><table><tr><th>Poste</th><th>Modèle</th><th class="r">durée</th><th class="r">coût</th><th>retouches</th></tr>${rows}
  <tr><td>✋ Ta validation</td><td class="mut">toi</td><td class="r num">${a.attente==null?'–':fmtMs(a.attente)}</td><td class="r num">0</td><td class="mut">attente médiane</td></tr></table></div></div>`;
}
function causes(a){
  const items=Object.entries(a.causes).sort((x,y)=>y[1]-x[1]);
  const body=items.length?`<div class="hb">${bars(items.map(([k,v],i)=>[CAUSES[k]||k,v,String(v),i===0?'hot':k==='autre'?'idle':'']),items[0][1])}</div>`
    :`<div class="empty-s"><b>0 changement demandé</b>${a.premierCoup} réponse${a.premierCoup>1?'s':''} validée${a.premierCoup>1?'s':''} telle${a.premierCoup>1?'s':''} quelle${a.premierCoup>1?'s':''}${a.refus?' · '+a.refus+' refusée'+(a.refus>1?'s':''):''}</div>`;
  return `<div class="box"><div class="h">Pourquoi tu demandes des changements <span class="mut">${a.changements} retour${a.changements>1?'s':''} à la gate</span></div>
  <p class="why">Tes retours classés par mots-clés (0 token). Chaque cause pointe vers un poste à régler.</p>${body}</div>`;
}
function heat(a){
  const lv=v=>v>=3?'lx':v===2?'l2':v===1?'l1':'l0';
  const projs=Object.keys(a.heat).sort();
  const rows=projs.map(p=>`<tr><td>${esc(p)}</td>${a.cats.map(c=>{const v=a.heat[p][c]||0;return `<td class="c ${lv(v)}">${v}</td>`;}).join('')}</tr>`).join('');
  const hot=[];for(const p of projs)for(const c of a.cats)if((a.heat[p][c]||0)>=3)hot.push(`🔥 ${p} · ${c} : ${a.heat[p][c]} demandes`);
  return `<div class="box"><div class="h">D'où viennent les demandes <span class="mut">projet × catégorie (🏷 Tri)</span></div>
  <p class="why">Ce qui revient. En rouge, 3 demandes ou plus sur le même sujet : un ticket de fond à ouvrir ?</p>
  ${rows?`<div class="scroll"><table class="heat"><tr><th></th>${a.cats.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${rows}</table></div>`:'<p class="mut">Aucune investigation sur la période.</p>'}
  ${hot.map(h=>`<p class="quote">${esc(h)}</p>`).join('')}
  ${a.cats.includes('non classée')?'<p class="note">« non classée » : investigations d\'avant le 🏷 Tri (#156), sans catégorie.</p>':''}</div>`;
}
function gatePills(d){
  const g=d.gate||{};if(!g.visites)return '';
  return [g.refus?pill('err','refusée'+(g.refus>1?' ×'+g.refus:'')):'',g.changements?pill('warn','changements ×'+g.changements):'',
    g.decision==='approuvee'?pill('ok','approuvée'):g.decision==='en_attente'?pill('warn','à valider'):''].filter(Boolean).join(' ');
}
function table(a,sel){
  const rows=a.rows.map(d=>`<tr class="row${d.msg===sel?' on':''}" data-msg="${esc(d.msg)}" tabindex="0"><td class="num">${esc(day(d.at))}</td><td>${esc(d.from||'?')}</td>
    <td style="white-space:normal">${esc(d.subject)}</td><td>${d.projet?esc(d.projet):'<span class="mut">·</span>'}</td>
    <td>${d.categorie?`<span class="tag">${esc(d.categorie)}</span>`:''}</td>
    <td class="r num" title="${d.reponse_brut_s==null?'':'en tout : '+esc(fmtDur(d.reponse_brut_s))}">${d.reponse_s==null?'<span class="mut">–</span>':esc(fmtDur(d.reponse_s))}</td>
    <td class="r num">${d.runs?fmtUsd(d.cout):'<span class="mut">·</span>'}</td><td>${gatePills(d)}</td>
    <td>${statePill(d.state)}${d.by&&d.state==='answered'?' <span class="mut">'+esc(d.by)+'</span>':''}${d.relance&&d.state!=='relaunched'?' '+pill('warn','↩'):''}</td></tr>`).join('');
  return `<div class="box"><div class="h">Historique <span class="mut">${a.n} demande${a.n>1?'s':''} · la plus récente d'abord · clic : sa fiche</span></div>
  ${rows?`<div class="scroll"><table><tr><th>Demande</th><th>Auteur</th><th>Sujet</th><th>Projet</th><th>Catégorie</th><th class="r">réponse en</th><th class="r">coût</th><th>Gate</th><th>Issue</th></tr>${rows}</table></div>`:'<p class="mut">Aucune demande sur la période.</p>'}</div>`;
}
function gantt(der){
  const pts=(der||[]).map(s=>({...s,t:Date.parse(s.at||'')})).filter(s=>s.t&&ROW[s.n]);
  if(!pts.length)return '<p class="mut">Déroulé indisponible (run oublié par Kronn avant le premier relevé).</p>';
  const t0=Math.min(...pts.map(s=>s.t)),t1=Math.max(...pts.map(s=>s.t+s.ms)),span=Math.max(1,t1-t0);
  const rows={};for(const s of pts)(rows[ROW[s.n]]||(rows[ROW[s.n]]=[])).push(s);
  const order=Object.values(ROW).filter((r,i,all)=>rows[r]&&all.indexOf(r)===i);
  return `<div class="gantt">${order.map(r=>`<span>${esc(r)}</span><span class="tr">${rows[r].map(s=>{const c=s.n==='gate'?'g':s.s==='Failed'?'x':s.n==='post'&&s.s==='Success'?'o':'';
    return `<i class="${c}" style="left:${((s.t-t0)/span*100).toFixed(1)}%;width:${(s.ms/span*100).toFixed(1)}%"></i>`;}).join('')}</span>`).join('')}</div>
  <div class="legend"><span><i style="background:var(--info)"></i>agent</span><span><i style="background:var(--warn)"></i>t'attend</span><span><i style="background:var(--err)"></i>en échec</span><span><i style="background:var(--ok)"></i>posté</span></div>`;
}
function trouve(f,d){
  const p=f.postes||{},out=[];
  if(p.tri)out.push(`🏷 ${p.tri.categorie?'<b>'+esc(p.tri.categorie)+'</b>':'sans catégorie'}${p.tri.urgence?', urgence '+esc(p.tri.urgence):''}${p.tri.deja_traite?', déjà traité':''}`);
  if(p.logs)out.push(`🔎 ${p.logs.verifs||0} vérification${p.logs.verifs>1?'s':''} à la main${(p.logs.outils||[]).length?' : '+p.logs.outils.map(esc).join(', '):''}`);
  if(p.cause)out.push(`🧩 cause ${p.cause.certitude==='etablie'?pill('ok','établie'):p.cause.certitude==='supposee'?pill('warn','supposée'):'sans certitude'}`);
  if(p.relecture&&(p.relecture.verdicts||[]).length)out.push(`🧐 ${p.relecture.verdicts.map(v=>v==='ok'?'ok':'« revoir »').join(' puis ')}`);
  if(!out.length)out.push('<span class="mut">Investigation d\'avant les postes (#156) : un seul agent, rien de structuré.</span>');
  return `<ul class="check">${out.map(x=>`<li>${x}</li>`).join('')}</ul>${d.piste?`<p class="quote">💡 Piste de fond : ${esc(d.piste)}</p>`:''}`;
}
function fiche(data,d){
  if(!d)return '';
  const f=(data.fiches||{})[d.msg];
  const head=`<div><b style="font-size:15px">${esc(d.from||'?')} · ${esc(d.subject)}</b><div class="mut">${esc(day(d.at))}${d.projet?' · '+esc(d.projet):''}${d.runs?' · '+d.runs+' investigation'+(d.runs>1?'s':'')+' · '+fmtUsd(d.cout):''}${d.reponse_s!=null?' · réponse en '+fmtDur(d.reponse_s)+' ouvrées ('+fmtDur(d.reponse_brut_s)+' en tout)':''}</div></div>`;
  if(!f)return `<div class="box">${head}<p class="mut">${d.runs?'Fiche détaillée gardée pour les investigations les plus récentes seulement.':'Pas d\'investigation : '+esc((STATES[d.state]||['',d.state])[1])+'.'}</p>
    <p class="mut">${d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener">fil Teams ↗</a>`:''}</p></div>`;
  const links=[d.disc?`<a href="${esc(discUrl(data,d.disc))}" target="_blank" rel="noopener">discussion Kronn ↗</a>`:'',d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener">fil Teams ↗</a>`:''].filter(Boolean).join(' · ');
  const reac=(f.reactions||[]).map(r=>r==='custom'?'🙂+':r);
  const suite=[reac.length?reac.join(' ')+' sur le message':'',f.replies?f.replies+' réponse'+(f.replies>1?'s':'')+' dans le fil':'',
    d.relance?'relancé par l\'auteur':'pas de relance',d.resolu?'✅':'pas de ✅'].filter(Boolean).join(' · ');
  return `<div class="box">${head}<div class="fiche">
  <div class="sec"><h4>Le parcours</h4>${gantt(f.deroule)}${f.comment?`<p class="mut" style="margin:6px 0 0">Ton commentaire au départ : « ${esc(f.comment)} »</p>`:''}</div>
  <div class="sec"><h4>Ce qu'ont trouvé les postes</h4>${trouve(f,d)}</div>
  <div class="sec"><h4>La réponse postée${f.versions>1?' · version '+f.versions:''}</h4>${f.reponse?`<div class="teams">${esc(f.reponse)}</div>`:'<p class="mut">Rien de posté.</p>'}</div>
  <div class="sec"><h4>Et ensuite</h4><p class="mut">${esc(suite)}${links?' · '+links:''}</p>
    ${(f.retours||[]).map(r=>`<p class="quote">✋ ${esc(CAUSES[r.cause]||r.cause)} : « ${esc(r.texte)} »</p>`).join('')}</div>
  </div></div>`;
}
function render(data,st){
  if(!data||!(data.demandes||[]).length)return `<header><h1>🚒 Support · bilan</h1></header><div class="box empty">Aucune demande dans l'historique pour l'instant. Il se remplit à chaque relevé du canal Support et à chaque investigation.</div>`;
  const a=aggregate(data,st);
  const projets=[...new Set((data.demandes||[]).map(d=>d.projet).filter(Boolean))].sort();
  const sel=a.rows.find(d=>d.msg===st.sel)||a.rows.find(d=>(data.fiches||{})[d.msg])||a.rows[0];
  const opt=(v,l)=>`<option value="${v}"${st.jours==v?' selected':''}>${l}</option>`;
  return `<header><div><h1>🚒 Support · bilan</h1><div class="mut">Canal « ${esc(data.canal||'Support')} » · investigations de l'agent Support · mis à jour ${esc(day(data.generated_at).slice(-5))}</div></div>
  <div class="filters"><label for="f-jours">Période</label><select id="f-jours">${opt(7,'7 jours')}${opt(30,'30 jours')}${opt(90,'90 jours')}</select>
  <label for="f-projet">Projet</label><select id="f-projet"><option value="">Tous</option>${projets.map(p=>`<option${p===st.projet?' selected':''}>${esc(p)}</option>`).join('')}</select></div></header>
  ${data.error?`<div class="note">Relevé incomplet : ${esc(data.error)}</div>`:''}
  ${kpis(a)}<div class="grid2">${funnel(a)}${postes(a)}</div><div class="grid2">${causes(a)}${heat(a)}</div>${table(a,sel&&sel.msg)}${fiche(data,sel)}`;
}
const B={readSupportBilan,aggregate,render,gantt,fmtDur,pick};
if(typeof window!=='undefined')window.SUPPORT_BILAN=B;
if(typeof document==='undefined'||!document.getElementById('app'))return;
let DATA=readSupportBilan(window.KronnPageData);
const ST={jours:30,projet:'',sel:null};
const app=document.getElementById('app');
function draw(){app.innerHTML=render(DATA,ST);}
app.addEventListener('change',e=>{const t=e.target;if(t.id==='f-jours')ST.jours=+t.value;else if(t.id==='f-projet')ST.projet=t.value;else return;draw();});
const choose=e=>{const r=e.target.closest('tr.row');if(!r)return;ST.sel=r.dataset.msg;draw();const n=app.querySelector('tr.row.on');if(n)n.focus();};
app.addEventListener('click',e=>{if(e.target.closest('a'))return;choose(e);});
app.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){if(e.target.closest('tr.row')){e.preventDefault();choose(e);}}});
window.addEventListener('kronn:page-data',e=>{const d=readSupportBilan(e.detail||window.KronnPageData);if(d){DATA=d;draw();}});
draw();
})();
</script>
</body>
