<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chaîne · bilan</title>
<!-- Page Kronn « Chaîne · bilan » : l'historique de la chaîne d'implémentation (dataset bilan, workflows/chaine_bilan.py,
     cron chaine_bilan). Vanilla, sans ressource externe (CSP de Kronn : script et style en ligne seulement). Couleurs : les
     jetons de page/src/styles.css. Le chiffre clé du vidéoprojecteur vient du champ kpi du dataset. -->
<style>
:root{
  --bg:#f3efe6; --panel:#fffdf8; --ink:#25221d; --muted:#6f685c; --line:#e2dccf; --chip:#f0ebe0;
  --accent:#2f6fd6; --ok:#2e9e5b; --warn:#d89614; --err:#d1453b; --info:#4a7fe0; --idle:#7a7266; --on-accent:#ffffff;
  --h0:#f0ebe0; --h1:#cfe0f7; --h2:#86aee9; --h3:#2f6fd6; --hx:#d1453b; --sign:#22232b; --sign-ink:#ece8df; --sign-mut:#a29c90;
  --opus:#8a5cd6; --sonnet:#2f6fd6; --haiku:#1f9e86;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#17181c; --panel:#202228; --ink:#ece8df; --muted:#a29c90; --line:#2f323a; --chip:#2a2d34;
  --accent:#6b9cf0; --ok:#4cc27c; --warn:#f0b03a; --err:#f06a5f; --info:#7aa2f2; --idle:#9a9284; --on-accent:#0d1b33;
  --h0:#2a2d34; --h1:#2c3d5c; --h2:#3f63a3; --h3:#6b9cf0; --hx:#f06a5f;
  --opus:#b48cff; --sonnet:#6b9cf0; --haiku:#3fc7b0;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#17181c; --panel:#202228; --ink:#ece8df; --muted:#a29c90; --line:#2f323a; --chip:#2a2d34;
  --accent:#6b9cf0; --ok:#4cc27c; --warn:#f0b03a; --err:#f06a5f; --info:#7aa2f2; --idle:#9a9284; --on-accent:#0d1b33;
  --h0:#2a2d34; --h1:#2c3d5c; --h2:#3f63a3; --h3:#6b9cf0; --hx:#f06a5f;
  --opus:#b48cff; --sonnet:#6b9cf0; --haiku:#3fc7b0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 16px 32px}
.wrap{max-width:1360px;margin:0 auto;display:grid;gap:14px}
.num,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.mut{color:var(--muted);font-size:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--sign);color:var(--sign-ink);padding:10px 14px;border-radius:8px}
h1{font:700 18px/1.3 ui-monospace,Menlo,monospace;margin:0;letter-spacing:.02em}
header .mut{color:var(--sign-mut)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters label{font:12px system-ui,sans-serif;color:var(--sign-ink)}
.filters select{background:#2f313a;border:2px solid #444754;padding:3px 6px;color:#ece8df}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:3px solid var(--line);padding:8px 12px;background:var(--panel)}
.kpi b{display:block;font:600 22px/1.15 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
.kpi.err b{color:var(--err)}
.up{color:var(--ok);font-weight:700}.down{color:var(--err);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px}
.box{border:3px solid var(--line);padding:10px 12px;background:var(--panel);min-width:0}
.h{font:700 12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px;display:flex;justify-content:space-between;gap:8px}
.h .mut{text-transform:none;letter-spacing:0;font-weight:400}
.why{color:var(--muted);font-size:12px;margin:0 0 10px}
.hb{display:grid;grid-template-columns:150px minmax(0,1fr) 56px;gap:4px 8px;align-items:center;font-size:12.5px}
.hb .bar{height:12px;background:var(--chip);position:relative}
.hb .bar i{position:absolute;inset:0 auto 0 0;background:var(--info)}
.hb .bar i.hot{background:var(--warn)}.hb .bar i.ok{background:var(--ok)}.hb .bar i.idle{background:var(--idle)}.hb .bar i.err{background:var(--err)}
.hb .v{text-align:right}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:12.5px;width:100%}
th{color:var(--muted);font-weight:600;text-align:left}
td,th{padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
.heat td.c{width:46px;height:26px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-weight:700;border:2px solid var(--panel)}
.heat th{text-align:center}.heat th:first-child{text-align:left}
.l0{background:var(--h0);color:var(--muted)}.l1{background:var(--h1)}.l2{background:var(--h2);color:#fff}.l3{background:var(--h3);color:var(--on-accent)}.lx{background:var(--hx);color:#fff}
.stack{display:flex;height:10px;width:110px;background:var(--chip)}.stack i{display:block;height:100%}
.pill{display:inline-block;font:700 10.5px system-ui;padding:1px 6px;white-space:nowrap}
.pill.ok{background:var(--ok);color:#fff}.pill.warn{background:var(--warn);color:#1c1c1c}.pill.err{background:var(--err);color:#fff}
.pill.idle{background:var(--chip);color:var(--muted)}.pill.info{background:var(--info);color:#fff}
svg text{fill:var(--muted);font:11px system-ui,sans-serif}
svg .ax{stroke:var(--line)}svg .ln{stroke:var(--accent);fill:none;stroke-width:2.5}svg .ar{fill:var(--accent);opacity:.12}
svg .pt{fill:var(--accent)}svg .mk{stroke:var(--warn);stroke-dasharray:3 3}svg .mkt{fill:var(--ink);font-weight:600}
svg .nd{fill:var(--chip);stroke:var(--line);stroke-width:2}svg .nt{fill:var(--ink)}svg .ed{stroke:var(--muted);fill:none;stroke-width:1.5}
svg .ed.dash{stroke-dasharray:4 3;stroke:var(--warn)}
tr.row{cursor:pointer}tr.row:hover td,tr.row:focus-visible td{background:var(--chip)}tr.row.on td{background:var(--chip);font-weight:600}
.fiche{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin-top:10px}
.sec.wide{grid-column:1/-1}
.sec h4{font:700 11.5px system-ui;text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;color:var(--muted)}
.gantt{display:grid;grid-template-columns:96px minmax(0,1fr);gap:3px 6px;font-size:11.5px;align-items:center}
.gantt .tr{position:relative;height:11px;background:var(--chip)}
.gantt .tr i{position:absolute;top:0;bottom:0;background:var(--info);min-width:2px}
.gantt .tr i.g{background:var(--warn)}.gantt .tr i.x{background:var(--err)}.gantt .tr i.o{background:var(--ok)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
.note{border-left:4px solid var(--warn);background:var(--chip);padding:6px 10px;font-size:12.5px;overflow-wrap:anywhere;white-space:normal}
.note.ok{border-color:var(--ok)}
.diff{font-family:ui-monospace,Menlo,monospace;font-size:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
.diff span{overflow-wrap:anywhere}.p{color:var(--ok)}.m{color:var(--err)}
.mm{background:var(--chip);padding:6px;overflow-x:auto}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
button:focus-visible,select:focus-visible,tr.row:focus-visible,tr.grp:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.hb .bar i.m{position:static;display:inline-block;height:100%}.hb .bar.mods{display:flex}
.chip{display:inline-block;font:700 10.5px ui-monospace,Menlo,monospace;padding:0 5px;margin-right:3px;color:#fff}
.chip.opus{background:var(--opus)}.chip.sonnet{background:var(--sonnet)}.chip.haiku{background:var(--haiku)}.chip.autre{background:var(--idle)}
tr.grp{cursor:pointer}tr.grp:hover td,tr.grp.on td{background:var(--chip)}tr.grp td.t{white-space:normal;max-width:360px}
tr.row td{color:var(--muted);font-size:12px}tr.row.on td{color:var(--ink)}
.stack.wide{width:160px}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin:10px 0;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--muted);font:600 13px system-ui,sans-serif;padding:6px 10px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:8px}
.ex div{background:var(--chip);padding:7px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:12.5px}
.blocs{display:grid;gap:6px;margin-top:10px}
.blocs details{background:var(--chip);padding:6px 10px}.blocs summary{cursor:pointer;font-weight:600;font-size:13px}
.blocs table td.n{white-space:normal}.blocs tr.sub td{color:var(--muted)}
.hb .bar i.tour{background:var(--err)}
details.analyse{border:3px solid var(--line);background:var(--panel);padding:8px 12px}details.analyse>summary{cursor:pointer;font:700 12px system-ui;text-transform:uppercase;letter-spacing:.06em}
details.analyse[open]>summary{margin-bottom:10px}details.analyse .grid2+.grid2,details.analyse .box+.grid2,details.analyse .grid2+.box{margin-top:14px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Chargement du bilan…</div></div>
<script>
'use strict';
(function(){
// cadrage = le poste 📋 Plan ; revue, schema et patterns : runs d'avant (postes retirés), gardés pour leurs jetons
const POSTES=[['code','⌨ Code'],['tests','🧪 Tests'],['cadrage','📋 Poste Plan'],['revue','🔁 Croisée'],['revue_pr','👀 Revue PR'],
  ['plan','🧠 Plan de l\'orchestrateur'],['orchestrateur','🧭 Orchestrateur'],['schema','🗺 Schéma'],['patterns','🧩 Patterns'],
  ['paralleles','🔎 Contrôles parallèles'],['retours','💬 Retours'],['pr','📤 PR'],['autre','Autre']];
const CTRL=[['regles','📏 Règles'],['securite','🔒 Sécurité'],['tests','🧪 Tests'],['perf','⚡ Perf·a11y'],['besoin','🎯 Besoin'],
  ['doc','📚 Doc'],['revue','🔁 Croisée']];
const ISSUES={pr_prete:['ok','PR prête'],pr_brouillon:['info','PR brouillon'],plan_seul:['idle','plan seul'],escalade:['warn','escalade'],
  en_cours:['info','en cours'],panne:['err','en panne'],rejete:['idle','rejeté'],annule:['idle','annulé'],termine:['ok','terminé']};
const CAUSES={perimetre:'périmètre',lecture:'mauvaise lecture',convention:'convention',decoupage:'découpage',autre:'autre'};
const ROW={ticket:'Préparation',prepare:'Préparation',cadrage:'📋 Plan',compris:'📋 Plan',questions:'📋 Plan',gate_questions:'✋ compris',
  schema:'📋 Plan',patterns:'📋 Plan',dossier:'📋 Plan',orchestrateur_plan:'📋 Plan',gate_plan:'✋ plan',code:'⌨ Code',
  controles:'🔎 Contrôles',orchestrateur:'🔎 Contrôles',gate_escalade:'✋ escalade',livraison:'📤 PR',gate_pr:'✋ PR',
  publication:'📤 PR',commente_plan:'📤 PR'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTok=n=>!n?'0':n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' M':Math.round(n/1e3)+' k';
const fmtDur=s=>{if(s==null)return '–';const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');};
const pct=(a,b)=>b?Math.round(a/b*100):0;
const plural=(n,a,b)=>n+' '+(n>1?b:a);
const fmtUsd=v=>v==null?'–':(v>=100?String(Math.round(v)):v.toFixed(v<10?2:1).replace('.',','))+' $';
const MODS=[['opus','Opus'],['sonnet','Sonnet'],['haiku','Haiku']];
const COUL={"Plan":'#7d8bff',"Plan de l'orchestrateur":'#9aa6ff',"Code":'#e8743b',"Tests":'#e0a020',"Contrôles":'#2e9e5b',"Orchestrateur":'#9a9284',
  "Revue PR":'#2a9fc9',"Retours":'#c95a9b',"PR":'#7a7266',"autre":'#5c6170'};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sum=o=>Object.values(o||{}).reduce((x,y)=>x+(+y||0),0);
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;};

function readBilan(k){
  try{
    if(!k||!k.datasets)return null;
    let d=k.datasets.bilan;
    if(d&&d.current!==undefined)d=d.current;
    if(typeof d==='string')d=JSON.parse(d);
    return d&&Array.isArray(d.tickets)?d:null;
  }catch(e){return null;}
}
// les lignes retenues par les filtres (période en jours, dépôt, essais)
function pick(data,f){
  const now=Date.parse(data.generated_at||'')||Date.now(), lim=now-(f.jours||30)*864e5;
  return (data.tickets||[]).filter(t=>(Date.parse(t.debut||'')||now)>=lim&&(!f.repo||t.repo===f.repo)&&(f.essais||!t.essai));
}
function aggregate(data,f){
  const rows=pick(data,f), fin=rows.filter(t=>t.issue!=='en_cours'&&t.tok);
  const a={rows,n:rows.length};
  a.livres=rows.filter(t=>t.issue==='pr_prete'||t.issue==='pr_brouillon').length;
  a.tok=avg(fin.map(t=>t.tok));
  a.tours=avg(rows.map(t=>(t.tours||{}).controles||0));
  let fait=0,tot=0;for(const t of rows){fait+=(t.exig||{}).fait||0;tot+=sum(t.exig);}
  a.exig=tot?pct(fait,tot):null;
  const withDoc=rows.filter(t=>t.doc);a.docN=withDoc.filter(t=>t.doc.fichiers>0).length;a.docTot=withDoc.length;
  a.docPlus=withDoc.reduce((x,t)=>x+t.doc.plus,0);a.docMoins=withDoc.reduce((x,t)=>x+t.doc.moins,0);
  a.perdu=avg(fin.map(t=>sum(t.perdu)));a.perduPct=pct(fin.reduce((x,t)=>x+sum(t.perdu),0),fin.reduce((x,t)=>x+t.tok,0));
  a.perduPar={echec:avg(fin.map(t=>(t.perdu||{}).echec||0)),panne:avg(fin.map(t=>(t.perdu||{}).panne||0))};
  const waits=rows.map(t=>sum(t.gates)/1e3);a.attente=waits.reduce((x,y)=>x+y,0);a.attenteMed=median(waits.filter(x=>x>0));
  a.postes={};for(const t of fin)for(const[k,v]of Object.entries(t.postes||{}))a.postes[k]=(a.postes[k]||0)+v;
  for(const k in a.postes)a.postes[k]/=fin.length||1;
  // versions : moyenne par version, dans l'ordre d'arrivée
  a.versions=(data.versions||[]).map(v=>{const ts=fin.filter(t=>t.version===v.hash);const all=rows.filter(t=>t.version===v.hash);
    let f2=0,t2=0;for(const t of all){f2+=(t.exig||{}).fait||0;t2+=sum(t.exig);}
    return {...v,n:all.length,tok:avg(ts.map(t=>t.tok)),tours:avg(all.map(t=>(t.tours||{}).controles||0)),exig:t2?pct(f2,t2):null};})
    .filter(v=>v.n);
  const vs=a.versions.filter(v=>v.tok);
  a.delta=vs.length>=2&&vs[vs.length-2].tok?Math.round((vs[vs.length-1].tok-vs[vs.length-2].tok)/vs[vs.length-2].tok*100):null;
  // contrôles : trouvés, corrigés, restés (bloquants et avis)
  a.ctrl={};for(const t of rows)for(const[p,v]of Object.entries(t.controles||{})){const c=a.ctrl[p]||(a.ctrl[p]=[0,0,0]);
    for(const k of ['bloquants','avis'])if(v[k])for(let i=0;i<3;i++)c[i]+=v[k][i];}
  // schéma : prévus et touchés, touchés pas prévus, prévus pas touchés
  a.schema=[0,0,0];for(const t of rows)if(t.schema){a.schema[0]+=t.schema.prevus_touches;a.schema[1]+=t.schema.touches_non_prevus;a.schema[2]+=t.schema.prevus_non_touches;}
  a.causes={};for(const t of rows)for(const[k,v]of Object.entries((t.retours||{}).par_cause||{}))a.causes[k]=(a.causes[k]||0)+v;
  a.weeks=weeks(fin,a.versions);
  // coût réel (journaux Claude Code, équivalent prix API) : par ticket, perdu, par poste et modèle
  const cr=rows.filter(t=>t.cout);a.cout=cr.length>0;
  a.usd=cr.reduce((x,t)=>x+t.cout.usd,0);
  a.usdPerdu=cr.filter(t=>/^(panne|annule|rejete)$/.test(t.issue)).reduce((x,t)=>x+t.cout.usd,0);
  a.groups=groups(rows);a.usdTicket=a.groups.length?a.usd/a.groups.length:0;
  a.postesUsd={};for(const t of cr){const mt=sum(t.cout.modeles)||1;for(const[p,v]of Object.entries(t.cout.postes||{})){const o=a.postesUsd[p]||(a.postesUsd[p]={t:0,m:{}});
    o.t+=v;const pm=(t.cout.postes_m||{})[p];if(pm){for(const[m,u]of Object.entries(pm))o.m[m]=(o.m[m]||0)+u;}else for(const[m,u]of Object.entries(t.cout.modeles||{}))o.m[m]=(o.m[m]||0)+v*u/mt;}}
  return a;
}
// une ligne par ticket (et dépôt) : ses runs, le plus récent d'abord
function groups(rows){
  const by=new Map();for(const t of rows){const k=t.ticket+'|'+t.repo;if(!by.has(k))by.set(k,{k,ticket:t.ticket,repo:t.repo,titre:t.titre,runs:[]});by.get(k).runs.push(t);}
  return [...by.values()];
}
function isoWeek(ms){const d=new Date(ms);d.setUTCHours(0,0,0,0);d.setUTCDate(d.getUTCDate()+3-((d.getUTCDay()+6)%7));
  const y=new Date(Date.UTC(d.getUTCFullYear(),0,4));return 1+Math.round(((d-y)/864e5-3+((y.getUTCDay()+6)%7))/7);}
function weeks(fin,versions){
  const by={};for(const t of fin){const ms=Date.parse(t.debut||'');if(!ms)continue;const w=isoWeek(ms),k=new Date(ms).getUTCFullYear()*100+w;
    (by[k]||(by[k]={k,w,tok:[]})).tok.push(t.tok);}
  const out=Object.values(by).sort((x,y)=>x.k-y.k).slice(-8).map(x=>({w:'S'+x.w,k:x.k,tok:avg(x.tok)}));
  for(const v of versions){const ms=Date.parse(v.debut||'');if(!ms)continue;const k=new Date(ms).getUTCFullYear()*100+isoWeek(ms);
    const i=out.findIndex(x=>x.k===k);if(i>0)out[i].mark=v.sujet||v.hash;}
  return out;
}
const issuePill=i=>{const[c,l]=ISSUES[i]||['idle',i||'?'];return `<span class="pill ${c}">${esc(l)}</span>`;};
const bars=(items,max,cls)=>items.map(([label,v,txt,c])=>`<span>${esc(label)}</span><span class="bar"><i class="${c||cls||''}" style="width:${max?Math.max(1,Math.round(v/max*100)):0}%"></i></span><span class="v num">${esc(txt)}</span>`).join('');

function kpis(a){
  const d=a.delta==null?'':` · <span class="${a.delta<=0?'up':'down'}">${a.delta>0?'+':'−'}${Math.abs(a.delta)} %</span> vs version d'avant`;
  const cout=a.cout?`<div class="kpi"><b>${fmtUsd(a.usdTicket)}</b><span>par ticket, tous ses runs (équivalent prix API)</span></div>
  <div class="kpi err"><b>${fmtUsd(a.usdPerdu)}</b><span>perdus dans des runs en panne, annulés ou rejetés · ${pct(a.usdPerdu,a.usd)} %</span></div>`
    :`<div class="kpi"><b>${fmtTok(a.tok)}</b><span>jetons par ticket${d}</span></div>
  <div class="kpi err"><b>${fmtTok(a.perdu)}</b><span>jetons perdus par ticket · ${a.perduPct} %</span></div>`;
  return `<div class="kpis">
  <div class="kpi"><b>${a.groups.filter(g=>g.runs.some(t=>t.issue==='pr_prete'||t.issue==='pr_brouillon')).length} / ${a.groups.length}</b><span>tickets livrés en PR</span></div>
  ${cout}
  <div class="kpi"><b>${fmtDur(a.attente)}</b><span>attente humaine aux gates (médiane ${fmtDur(a.attenteMed)})</span></div>
</div>`;
}
// coût réel par poste, empilé par modèle ; sans journaux, les jetons de Kronn (sortie seulement)
function money(a){
  if(!a.cout)return tokens(a);
  const items=Object.entries(a.postesUsd).sort((x,y)=>y[1].t-x[1].t), max=items.length?items[0][1].t:0;

  const line=(r,sub)=>`<tr${sub?' class="sub"':''}><td class="n">${sub?'&nbsp;&nbsp;&nbsp;└ ':''}${esc(r.n)}</td><td>${chip(r.m)}</td><td class="r num">${r.r}</td><td class="r num">${fmtTok(r.c)}</td><td class="r num">${fmtTok(r.o)}</td><td class="r num">${fmtUsd(sub?r.usd:rc(r))}</td><td>${sub?'':`<span class="stack" style="width:120px"><i style="width:${(rc(r)/mr*100).toFixed(1)}%;background:var(--accent)"></i></span>`}</td></tr>`;
  return `<p class="why">Chaque étape de Kronn et ses sous-workflows, avec les sessions qu'ils ont lancées (sous-agents des contrôleurs compris). « Relu en cache » : le contexte renvoyé à chaque réponse, payé moins cher ; c'est l'essentiel d'une longue session.</p>
  <div class="hb" style="grid-template-columns:110px minmax(0,1fr) 120px">${B.map(b=>{const n=b.n.split(' : ')[0];return `<span>${esc(n)}</span><span class="bar"><i class="${/^Tour [2-9]/.test(n)?'tour':''}" style="width:${(bc(b)/mb*100).toFixed(1)}%"></i></span><span class="v num">${fmtUsd(bc(b))} · ${pct(bc(b),all)} %</span>`;}).join('')}</div>
  <div class="blocs">${B.map((b,i)=>`<details data-b="${i}"${i===1?' open':''}><summary>${esc(b.n)} <span class="mut">· ${fmtUsd(bc(b))} · ${pct(bc(b),all)} %</span></summary>
    <div class="scroll"><table><tr><th>poste</th><th>modèle</th><th class="r">réponses</th><th class="r">relu en cache</th><th class="r">sortie</th><th class="r">coût</th><th>part</th></tr>
    ${b.rows.map(r=>line(r)+(r.subs||[]).map(y=>line(y,true)).join('')).join('')}</table></div></details>`).join('')}</div>
  <p class="mut" style="margin:6px 0 0">Total du run : <b>${fmtUsd(all)}</b>. En rouge : les tours de correction.</p>`;
}
function fiche(data,t,tab){
  if(!t)return '';
  const f=(data.fiches||{})[t.run];
  const ex=f?f.exigences:[];
  const head=`<div><b style="font-size:15px">${esc(t.ticket)} · ${esc(t.titre)}</b><div class="mut">${esc(t.repo)} · run <span class="mono">${esc(String(t.run).slice(0,8))}</span> · ${issuePill(t.issue)} · version <span class="mono">${esc(t.version||'–')}</span> · ${esc((t.debut||'').slice(0,10))}${t.pr&&t.pr.n?' · PR #'+esc(t.pr.n):''} · ${t.cout?fmtUsd(t.cout.usd)+' · ':''}${fmtTok(t.tok)} jetons de sortie · ${fmtDur(t.duree)}</div></div>`;
  if(!f)return `<div class="box">${head}<p class="mut">Fiche détaillée gardée pour les runs les plus récents seulement.</p></div>`;
  const r=f.resume||{};
  const ETAT={fait:'ok',partiel:'warn',non:'err',autrement:'info',hors_scope:'idle'};
  const T=[['cout','💰 Coût détaillé'],['exig',`🎯 Exigences · ${(t.exig||{}).fait||0} / ${sum(t.exig)}`],['deroule','⏱ Déroulé'],['doc','📚 Doc et impact']];
  const cur=T.some(([k])=>k===tab)?tab:'cout';
  const body={cout:()=>blocs(f),
    exig:()=>ex.length?`<div class="ex">${ex.map(x=>`<div><span class="pill ${ETAT[x.etat]||'idle'}">${esc(String(x.etat).replace('_',' '))}</span><span>${esc(x.exigence)}</span></div>`).join('')}</div>`:'<p class="mut">Aucune (poste 🎯 Besoin pas passé).</p>',
    deroule:()=>`<div class="fiche"><div class="sec"><h4>Déroulé</h4>${gantt(f.deroule)}</div>
      <div class="sec"><h4>Ce qui en est sorti</h4><div class="note ok">${esc(r.orchestrateur||r.comprehension||'(pas de résumé)')}</div>
      ${r.comprehension&&r.orchestrateur?`<p class="mut" style="margin:6px 0 0">Compris au cadrage : ${esc(r.comprehension)}</p>`:''}</div>
      ${f.retours.length?`<div class="sec"><h4>Tes retours</h4>${f.retours.map(x=>`<p class="mut" style="margin:0 0 4px">✋ ${esc(x.gate)} · ${esc(CAUSES[x.cause]||x.cause)} : ${esc(x.texte)}</p>`).join('')}</div>`:''}</div>`,
    doc:()=>`<div class="sec"><h4>Documentation · 📚 Doc</h4>${f.doc.fichiers.length?`<div class="diff">${f.doc.fichiers.map(d=>`<span>${esc(d.fichier)}</span><span><b class="p">+${d.plus}</b> <b class="m">−${d.moins}</b></span>`).join('')}</div>`:'<p class="mut">Aucune doc modifiée.</p>'}
      ${f.doc.a_mettre_a_jour.length?`<div class="note" style="margin-top:6px">Restée à mettre à jour : ${f.doc.a_mettre_a_jour.map(esc).join(', ')}</div>`:''}</div>
      <div class="sec" style="margin-top:14px"><h4>Schéma d'impact <span class="mut" style="text-transform:none;letter-spacing:0">· le libellé d'une flèche au survol</span></h4>${f.mermaid?`<div class="mm">${flowchart(f.mermaid)}</div>`:'<p class="mut">Pas de schéma.</p>'}
      ${f.touches_non_prevus.length?`<p class="mut" style="margin:6px 0 0">Touchés sans être prévus : ${f.touches_non_prevus.slice(0,6).map(esc).join(', ')}</p>`:''}</div>`};
  return `<div class="box">${head}<div class="tabs" role="tablist">${T.map(([k,l])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${k===cur}" class="${k===cur?'on':''}">${esc(l)}</button>`).join('')}</div>${body[cur]()}</div>`;
}
function render(data,st){
  if(!data||!(data.tickets||[]).length)return `<header><h1>🗄 Chaîne · bilan</h1></header><div class="box empty">Aucun run de la chaîne d'implémentation pour l'instant. Le bilan se remplit à chaque ticket posé sur la chaîne.</div>`;
  const a=aggregate(data,st);
  const repos=[...new Set((data.tickets||[]).map(t=>t.repo).filter(Boolean))].sort();
  const sel=a.rows.find(t=>t.run===st.sel)||a.rows[0];
  return `<header><div><h1>🗄 Chaîne · bilan</h1><div class="mut">Historique de la chaîne d'implémentation · mis à jour ${esc((data.generated_at||'').slice(11,16))} UTC</div></div>
  <div class="filters"><label for="f-jours">Période</label><select id="f-jours"><option value="7"${st.jours==7?' selected':''}>7 jours</option><option value="30"${st.jours==30?' selected':''}>30 jours</option></select>
  <label for="f-repo">Dépôt</label><select id="f-repo"><option value="">Tous</option>${repos.map(r=>`<option${r===st.repo?' selected':''}>${esc(r)}</option>`).join('')}</select>
  <label><input type="checkbox" id="f-essais"${st.essais?' checked':''}> essais</label></div></header>
  ${kpis(a)}<div class="grid2">${money(a)}${top(a)}</div>${table(a,st,sel&&sel.run)}${fiche(data,sel,st.tab)}
  <details class="analyse"${st.analyse?' open':''}><summary>Analyse de la chaîne : versions, allers-retours, contrôles, schéma, tes retours</summary>
  <div class="grid2">${versions(a)}${lost(a)}</div>${heat(a)}<div class="grid2">${controls(a)}${schema(a)}</div>${a.cout?`<div class="grid2">${tokens(a)}${a.weeks.length>=3?'':curve(a)}</div>`:''}</details>`;
}
const B={readBilan,aggregate,render,flowchart,gantt,fmtTok,fmtDur,fmtUsd,verdict,isoWeek,groups};
if(typeof window!=='undefined')window.BILAN=B;
if(typeof document==='undefined'||!document.getElementById('app'))return;
let DATA=readBilan(window.KronnPageData);
const ST={jours:30,repo:'',essais:false,sel:null,open:new Set(),tab:'cout',analyse:false};
const app=document.getElementById('app');
function draw(){app.innerHTML=render(DATA,ST);}
app.addEventListener('change',e=>{const t=e.target;if(t.id==='f-jours')ST.jours=+t.value;else if(t.id==='f-repo')ST.repo=t.value;else if(t.id==='f-essais')ST.essais=t.checked;else return;draw();});
// une ligne de ticket : déplie ses runs et ouvre la fiche du plus récent ; une ligne de run : sa fiche ; un onglet de la fiche
const choose=e=>{const tab=e.target.closest('[data-tab]');if(tab){ST.tab=tab.dataset.tab;draw();return;}
  const g=e.target.closest('tr.grp');
  if(g){const k=g.dataset.g, grp=groups(DATA.tickets||[]).find(x=>x.k===k);if(ST.open.has(k)&&grp&&grp.runs.some(t=>t.run===ST.sel))ST.open.delete(k);else{ST.open.add(k);if(grp)ST.sel=grp.runs[0].run;}
    draw();const n=app.querySelector(`tr.grp[data-g="${CSS.escape(k)}"]`);if(n)n.focus();return;}
  const r=e.target.closest('tr.row');if(!r)return;ST.sel=r.dataset.run;draw();const n=app.querySelector('tr.row.on');if(n)n.focus();};
app.addEventListener('click',choose);
app.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){if(e.target.closest('tr.row,tr.grp')){e.preventDefault();choose(e);}}});
app.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.analyse'))ST.analyse=e.target.open;},true);
window.addEventListener('kronn:page-data',e=>{const d=readBilan(e.detail||window.KronnPageData);if(d){DATA=d;draw();}});
draw();
})();
</script>
</body>
</html>
